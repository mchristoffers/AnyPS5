name: Anno libs (Windows)

on:
  push:
    branches: [anno-http2-ssl-callback]
  workflow_dispatch:

permissions:
  contents: read

env:
  CONFIGURE: >-
    -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
    -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
  WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
  WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip

jobs:
  libs:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Point the WinLibs CMake at the CA bundle of Git for Windows
        run: |
          for prefix in ucrt64 mingw64; do
            bundle="C:/Program Files/Git/$prefix/etc/ssl/certs/ca-bundle.crt"
            if [ -f "$bundle" ]; then echo "SSL_CERT_FILE=$bundle" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo "::error::No CA bundle found in Git for Windows"; exit 1
      - name: Download WinLibs
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs
          echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
      - name: Configure
        shell: cmd
        run: cmake -S . -B build %CONFIGURE%
      - name: Build libraries
        shell: cmd
        run: cmake --build build --target libs
      - name: Collect libs with MinGW runtime
        run: |
          mkdir -p out/libs
          cp build/core/libs/libs/*.prx out/libs/
          for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do cp "C:/winlibs/mingw64/bin/$dll" out/libs/; done
      - uses: actions/upload-artifact@v7
        with:
          name: prx-windows-anno
          path: out/libs/*
          if-no-files-found: error
